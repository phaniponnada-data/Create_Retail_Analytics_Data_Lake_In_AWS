<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="430" viewBox="0 0 1250 430" role="img" aria-labelledby="title desc">
  <title id="title">Data lake zones</title><desc id="desc">Raw CSV flows through Glue validation into curated Parquet and gold aggregates, while invalid rows flow into quarantine.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.title{font:700 27px Arial,sans-serif;fill:#0f172a}.label{font:700 19px Arial,sans-serif;fill:#0f172a}.sub{font:14px Arial,sans-serif;fill:#334155}.edge{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.box{stroke-width:2.5;rx:15;ry:15}</style></defs>
  <rect width="1250" height="430" fill="#f8fafc"/><text x="625" y="45" text-anchor="middle" class="title">Data Lake Zones and Quality Flow</text>
  <rect class="box" x="45" y="130" width="230" height="145" fill="#e0f2fe" stroke="#0284c7"/><text x="160" y="172" text-anchor="middle" class="label">BRONZE / RAW</text><text x="160" y="204" text-anchor="middle" class="sub">Original source CSV</text><text x="160" y="229" text-anchor="middle" class="sub">Immutable audit evidence</text><text x="160" y="254" text-anchor="middle" class="sub">Replay source</text>
  <rect class="box" x="345" y="130" width="230" height="145" fill="#fff7ed" stroke="#f97316"/><text x="460" y="172" text-anchor="middle" class="label">GLUE QUALITY GATE</text><text x="460" y="204" text-anchor="middle" class="sub">Schema and key checks</text><text x="460" y="229" text-anchor="middle" class="sub">Duplicate detection</text><text x="460" y="254" text-anchor="middle" class="sub">Reference validation</text>
  <rect class="box" x="645" y="130" width="230" height="145" fill="#dcfce7" stroke="#16a34a"/><text x="760" y="172" text-anchor="middle" class="label">SILVER / CURATED</text><text x="760" y="204" text-anchor="middle" class="sub">Validated typed records</text><text x="760" y="229" text-anchor="middle" class="sub">Parquet + Snappy</text><text x="760" y="254" text-anchor="middle" class="sub">Partitioned detail</text>
  <rect class="box" x="945" y="130" width="230" height="145" fill="#ecfccb" stroke="#65a30d"/><text x="1060" y="172" text-anchor="middle" class="label">GOLD</text><text x="1060" y="204" text-anchor="middle" class="sub">Daily sales</text><text x="1060" y="229" text-anchor="middle" class="sub">Customer 360</text><text x="1060" y="254" text-anchor="middle" class="sub">Business aggregates</text>
  <rect class="box" x="345" y="325" width="230" height="80" fill="#fee2e2" stroke="#dc2626"/><text x="460" y="359" text-anchor="middle" class="label">QUARANTINE</text><text x="460" y="385" text-anchor="middle" class="sub">reject_reason + run_id</text>
  <path class="edge" d="M275 203 H345"/><path class="edge" d="M575 203 H645"/><path class="edge" d="M875 203 H945"/><path class="edge" d="M460 275 V325"/>
  <text x="605" y="190" text-anchor="middle" class="sub" fill="#16a34a">valid rows</text><text x="475" y="305" class="sub" fill="#dc2626">invalid rows</text>
</svg>
