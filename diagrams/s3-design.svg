<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
  <title id="title">Amazon S3 data lake prefix design</title><desc id="desc">The project bucket contains raw source entity prefixes, curated entities, quarantine by run ID, gold reporting tables, and Athena query results.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.title{font:700 27px Arial,sans-serif;fill:#0f172a}.label{font:700 17px Arial,sans-serif;fill:#0f172a}.sub{font:14px Consolas,monospace;fill:#334155}.edge{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.box{stroke-width:2;rx:12;ry:12}</style></defs>
  <rect width="1300" height="760" fill="#f8fafc"/><text x="650" y="42" text-anchor="middle" class="title">Amazon S3 Prefix Design</text>
  <rect class="box" x="500" y="70" width="300" height="75" fill="#fef3c7" stroke="#d97706"/><text x="650" y="104" text-anchor="middle" class="label">Project bucket</text><text x="650" y="129" text-anchor="middle" class="sub">s3://&lt;BUCKET&gt;/</text>

  <rect class="box" x="35" y="205" width="220" height="80" fill="#e0f2fe" stroke="#0284c7"/><text x="145" y="239" text-anchor="middle" class="label">RAW</text><text x="145" y="264" text-anchor="middle" class="sub">raw/source=retail/</text>
  <rect class="box" x="290" y="205" width="220" height="80" fill="#dcfce7" stroke="#16a34a"/><text x="400" y="239" text-anchor="middle" class="label">CURATED</text><text x="400" y="264" text-anchor="middle" class="sub">curated/</text>
  <rect class="box" x="545" y="205" width="220" height="80" fill="#fee2e2" stroke="#dc2626"/><text x="655" y="239" text-anchor="middle" class="label">QUARANTINE</text><text x="655" y="264" text-anchor="middle" class="sub">quarantine/</text>
  <rect class="box" x="800" y="205" width="220" height="80" fill="#ecfccb" stroke="#65a30d"/><text x="910" y="239" text-anchor="middle" class="label">GOLD</text><text x="910" y="264" text-anchor="middle" class="sub">gold/</text>
  <rect class="box" x="1055" y="205" width="210" height="80" fill="#e2e8f0" stroke="#475569"/><text x="1160" y="239" text-anchor="middle" class="label">QUERY RESULTS</text><text x="1160" y="264" text-anchor="middle" class="sub">athena-results/</text>

  <path class="edge" d="M610 145 L145 205"/><path class="edge" d="M630 145 L400 205"/><path class="edge" d="M650 145 V205"/><path class="edge" d="M670 145 L910 205"/><path class="edge" d="M690 145 L1160 205"/>

  <rect class="box" x="25" y="350" width="240" height="315" fill="#ffffff" stroke="#7dd3fc"/><text x="145" y="382" text-anchor="middle" class="label">Raw entity prefixes</text><text x="45" y="420" class="sub">entity=customers/</text><text x="45" y="451" class="sub">entity=products/</text><text x="45" y="482" class="sub">entity=orders/</text><text x="45" y="513" class="sub">entity=order_items/</text><text x="45" y="544" class="sub">entity=order_status_events/</text><text x="45" y="590" class="sub">Each contains:</text><text x="45" y="621" class="sub">ingest_date=YYYY-MM-DD/</text><text x="45" y="648" class="sub">source.csv</text>
  <rect class="box" x="285" y="350" width="240" height="315" fill="#ffffff" stroke="#86efac"/><text x="405" y="382" text-anchor="middle" class="label">Curated entities</text><text x="305" y="420" class="sub">customers/</text><text x="305" y="451" class="sub">products/</text><text x="305" y="482" class="sub">orders/</text><text x="320" y="509" class="sub">order_date=...</text><text x="305" y="544" class="sub">order_items/</text><text x="320" y="571" class="sub">order_date=...</text><text x="305" y="606" class="sub">order_status_events/</text><text x="305" y="638" class="sub">*.snappy.parquet</text>
  <rect class="box" x="545" y="350" width="220" height="315" fill="#ffffff" stroke="#fca5a5"/><text x="655" y="382" text-anchor="middle" class="label">Rejected entities</text><text x="565" y="425" class="sub">entity=orders/</text><text x="580" y="455" class="sub">run_id=.../</text><text x="565" y="500" class="sub">entity=order_items/</text><text x="580" y="530" class="sub">run_id=.../</text><text x="565" y="575" class="sub">Parquet rows with</text><text x="565" y="603" class="sub">reject_reason</text>
  <rect class="box" x="800" y="350" width="220" height="315" fill="#ffffff" stroke="#bef264"/><text x="910" y="382" text-anchor="middle" class="label">Reporting outputs</text><text x="820" y="430" class="sub">daily_sales/</text><text x="820" y="475" class="sub">customer_360/</text><text x="820" y="530" class="sub">Athena CTAS</text><text x="820" y="558" class="sub">Parquet + Snappy</text><text x="820" y="603" class="sub">Business-ready</text><text x="820" y="631" class="sub">aggregates</text>
  <rect class="box" x="1055" y="350" width="210" height="315" fill="#ffffff" stroke="#94a3b8"/><text x="1160" y="382" text-anchor="middle" class="label">Athena output</text><text x="1075" y="430" class="sub">Query result CSV</text><text x="1075" y="461" class="sub">Metadata files</text><text x="1075" y="510" class="sub">Separate from</text><text x="1075" y="538" class="sub">business data</text>
  <path class="edge" d="M145 285 V350"/><path class="edge" d="M400 285 V350"/><path class="edge" d="M655 285 V350"/><path class="edge" d="M910 285 V350"/><path class="edge" d="M1160 285 V350"/>
</svg>
